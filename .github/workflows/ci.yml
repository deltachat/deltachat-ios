name: CI
on:
  push:

permissions: {}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          show-progress: false
          persist-credentials: false
      
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      
      - name: Cache pods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            Pods
          key: pods-${{ hashFiles('Podfile.lock') }}
      - name: Cache core
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            deltachat-ios/libraries/deltachat-core-rust/target
          key: core-${{ hashFiles('rust-toolchain', 'deltachat-ios/libraries/deltachat-core-rust/Cargo.lock') }}

      - run: cargo install cargo-lipo
      - run: pod install
      - run: set -o pipefail && xcodebuild -workspace deltachat-ios.xcworkspace -scheme deltachat-ios -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=latest" test
