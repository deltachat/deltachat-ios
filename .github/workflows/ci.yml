name: CI
on:
  push:

permissions: {}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          show-progress: false
          persist-credentials: false
      
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      
      - name: Cache pods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            Pods
          key: pods-${{ hashFiles('Podfile.lock') }}
      - name: Cache core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: deltachat-ios/libraries/libdeltachat.a
          key: core-${{ hashFiles('rust-toolchain', 'deltachat-ios/libraries/deltachat-core-rust/Cargo.lock') }}
        
      - run: cargo install cargo-lipo
      - run: pod install
      # Boot the simulator while building so it is already running when the tests start
      - run: xcrun simctl boot "iPhone 18 Pro"
      - name: Build core if it was not cached
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-core.sh
      - name: Build and test app
        run: >-
          xcodebuild
          -workspace deltachat-ios.xcworkspace
          -scheme deltachat-ios
          -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=latest"
          test
          -retry-tests-on-failure
          -test-iterations 3
          CI=true

