name: CI
on:
  push:

permissions: {}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          show-progress: false
          persist-credentials: false
      
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      
      - name: Cache pods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            Pods
          key: pods-${{ hashFiles('Podfile.lock') }}
      - name: Run sccache-cache for core
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set Rust caching env vars
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> $GITHUB_ENV
        
      - run: cargo install cargo-lipo
      - run: pod install
      # Boot the simulator while building so it is already running when the tests start
      - run: xcrun simctl boot "iPhone 18 Pro"
      - name: Build and test
        run: >-
          xcodebuild
          -workspace deltachat-ios.xcworkspace
          -scheme deltachat-ios
          -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=latest"
          test
          -retry-tests-on-failure
          -test-iterations 3
